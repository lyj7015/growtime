name: Build iOS IPA

# 手动触发，或改动 app/ src/ assets/ 时自动触发
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - 'assets/**'

jobs:
  build:
    runs-on: macos-15 # Apple Silicon；macos-14 默认 Xcode 15.4，不满足 RN 0.86 的 >=16.1 要求
    steps:
      - uses: actions/checkout@v4

      # 显式选 Xcode：RN 0.86 需要 >=16.1，但 26.x 的 Swift 6.2 与其不兼容（RuntimeScheduler 注解报错），
      # 优先选 16.x，与 EAS 云构建环境一致
      - name: Select Xcode 16.x
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"; fi
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # eas build --local 在 GitHub 的 macOS 机器上本地构建，
      # 不消耗 EAS 免费额度；证书/描述文件从 Expo 服务器自动拉取（需 EXPO_TOKEN）。
      # EAS_BUILD_XCODEBUILD_FORMATTER=none 关闭 xcbeautify，让 xcodebuild 原始输出直接进 job 日志，
      # 否则 Pod 脚本阶段（如 Build ExpoModulesJSI xcframework）失败时看不到真实报错。
      - name: Build IPA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_XCODEBUILD_FORMATTER: none
        run: |
          npx eas-cli@latest build \
            --local \
            --platform ios \
            --profile preview \
            --non-interactive \
            --output Build/GrowTime.ipa \
            --no-wait

      - name: Collect xcodebuild logs on failure
        if: failure()
        run: |
          mkdir -p ./xlogs
          cp -f ./emjsi-build.log ./xlogs/ 2>/dev/null || true
          cp -f "$HOME/emjsi-build.log" ./xlogs/ 2>/dev/null || true
          find /private/var/folders /var/folders -type d -name logs -path "*eas-build-local-nodejs*" 2>/dev/null | while read d; do cp -r "$d"/. ./xlogs/ 2>/dev/null || true; done
          du -sh ./xlogs || true

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: xlogs/
          retention-days: 7

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrowTime-ipa
          path: Build/GrowTime.ipa
          retention-days: 30
