name: Build iOS IPA

# 手动触发，或改动 app/ src/ assets/ 时自动触发
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - 'assets/**'

jobs:
  build:
    runs-on: macos-15 # Apple Silicon；macos-14 默认 Xcode 15.4，不满足 RN 0.86 的 >=16.1 要求
    steps:
      - uses: actions/checkout@v4

      # 显式选最新的 Xcode，避免默认版本过旧
      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # eas build --local 在 GitHub 的 macOS 机器上本地构建，
      # 不消耗 EAS 免费额度；证书/描述文件从 Expo 服务器自动拉取（需 EXPO_TOKEN）
      - name: Build IPA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build \
            --local \
            --platform ios \
            --profile preview \
            --non-interactive \
            --output Build/GrowTime.ipa \
            --no-wait

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrowTime-ipa
          path: Build/GrowTime.ipa
          retention-days: 30
