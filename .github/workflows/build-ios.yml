name: Build iOS IPA

# 手动触发，或改动 app/ src/ assets/ 时自动触发
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - 'assets/**'

jobs:
  build:
    runs-on: macos-15 # Apple Silicon；macos-14 默认 Xcode 15.4，不满足 RN 0.86 的 >=16.1 要求
    env:
      # ExpoModulesJSI 的 Package.swift 要求 Swift tools 6.2（Xcode 16.x 只有 6.1），
      # 而 Xcode 26.3 的 Swift 又引发 RuntimeScheduler 注解错误 → 用 26.2
      XCODE_VERSION: 26.2
    steps:
      - uses: actions/checkout@v4

      # 显式选指定版本的 Xcode
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_${XCODE_VERSION}*.app 2>/dev/null | sort -V | tail -1)"
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 诊断步骤：在 EAS 沙箱外手动复现 "Build ExpoModulesJSI xcframework" 脚本，
      # 让它的真实报错直接打在 job 日志里（EAS 内部该阶段输出被 xcbeautify 吞掉）。
      # 若此步失败则直接停（无需再跑 eas build）。
      - name: Reproduce ExpoModulesJSI build (debug)
        run: |
          npx expo prebuild -p ios --no-install
          cd ios && pod install
          cd ../node_modules/expo-modules-jsi/apple
          PODS_ROOT="$(cd ../../../ios/Pods && pwd)" bash scripts/build-xcframework.sh

      # eas build --local 在 GitHub 的 macOS 机器上本地构建，
      # 不消耗 EAS 免费额度；证书/描述文件从 Expo 服务器自动拉取（需 EXPO_TOKEN）。
      - name: Build IPA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build \
            --local \
            --platform ios \
            --profile preview \
            --non-interactive \
            --output Build/GrowTime.ipa \
            --no-wait

      - name: Collect xcodebuild logs on failure
        if: failure()
        run: |
          mkdir -p ./xlogs
          cp -f ./emjsi-build.log ./xlogs/ 2>/dev/null || true
          cp -f "$HOME/emjsi-build.log" ./xlogs/ 2>/dev/null || true
          find /private/var/folders /var/folders -type d -name logs -path "*eas-build-local-nodejs*" 2>/dev/null | while read d; do cp -r "$d"/. ./xlogs/ 2>/dev/null || true; done
          du -sh ./xlogs || true

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: xlogs/
          retention-days: 7

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrowTime-ipa
          path: Build/GrowTime.ipa
          retention-days: 30
