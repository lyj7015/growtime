name: Build AgeFace IPA (borrowed credentials)

# 临时 workflow：AgeFace 仓库缺 EXPO_TOKEN secret，
# 而 EAS 证书/描述文件存在 Expo 服务器、与仓库无关，
# 因此在 GrowTime 仓库（持有 EXPO_TOKEN）里 checkout AgeFace 代码构建。
# AgeFace 拿到自己的 EXPO_TOKEN 后即可删除本文件。
on:
  workflow_dispatch:
    inputs:
      ageface_ref:
        description: 'AgeFace 要构建的分支/ref'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: macos-15
    env:
      # Xcode 26.2：ExpoModulesJSI 的 Package.swift 要求 Swift tools 6.2，
      # 而 Xcode 26.3 的 Swift 有 RuntimeScheduler 注解回归
      XCODE_VERSION: 26.2
      APP_OUTPUT: AgeFace.ipa
      REPO: lyj7015/ageface
    steps:
      - name: Checkout AgeFace
        uses: actions/checkout@v4
        with:
          repository: lyj7015/ageface
          ref: ${{ inputs.ageface_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh-key: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_${XCODE_VERSION}*.app 2>/dev/null | sort -V | tail -1)"
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # AgeFace 未使用 expo-modules-jsi，用 expo prebuild + pod install 即可。
      # --repo-update 让 CocoaPods 拿到最新的 CDN 索引，避免 CDN 超时。
      - name: Prebuild and pods
        run: |
          npx expo prebuild -p ios --no-install
          cd ios && pod install --repo-update

      - name: Build IPA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_OPENLUX_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENLUX_API_KEY }}
        run: |
          npx eas-cli@latest build \
            --local \
            --platform ios \
            --profile preview \
            --non-interactive \
            --output "Build/${APP_OUTPUT}" \
            --no-wait

      - name: Collect xcodebuild logs on failure
        if: failure()
        run: |
          mkdir -p ./xlogs
          find /private/var/folders /var/folders -type d -name logs -path "*eas-build-local-nodejs*" 2>/dev/null | while read d; do cp -r "$d"/. ./xlogs/ 2>/dev/null || true; done
          du -sh ./xlogs || true

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ageface-xcode-logs
          path: xlogs/
          retention-days: 7

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgeFace-ipa
          path: Build/AgeFace.ipa
          retention-days: 30